name: Upstream Watch

on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-maintenance-${{ github.repository }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm run validate
      - name: Download, verify and adapt reviewed upstreams
        run: npm run watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run validate
      - run: npm run build
      - run: npm test
      - run: npm run check:build
      - name: Save audit report and source snapshots (never executed)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-audit-${{ github.run_id }}
          path: work/upstreams/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish verified changes only
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstreams/status.json config/providers.json dist/splayer-source.js
          if git diff --cached --quiet; then
            echo "No changes to publish" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git commit -m "chore: synchronize verified upstreams and plugin"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$TARGET_BRANCH"
      - name: Explain failure
        if: failure()
        run: |
          echo "::error::Verification or publication failed. No unverified plugin was published. See failed step and artifacts."
          echo "## Failed: inspect the failed step; previous published files remain the fallback unless publication already completed." >> "$GITHUB_STEP_SUMMARY"
