name: Validate Cloud Resolver

on:
  pull_request:
    paths:
      - "resolver/**"
      - ".github/workflows/resolver-validate.yml"
  push:
    branches: [main]
    paths:
      - "resolver/**"
      - ".github/workflows/resolver-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-resolver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install resolver dependencies
        working-directory: resolver
        run: npm install --no-audit --no-fund
      - name: Syntax and matcher tests
        working-directory: resolver
        run: npm run check
      - name: Build resolver Docker image
        run: docker build -f resolver/Dockerfile resolver -t splayer-koyeb-resolver:test
