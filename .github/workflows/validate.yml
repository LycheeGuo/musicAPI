name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run validate
      - run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILD_VERSION: 1.0.0
          GITHUB_SHA: ${{ github.sha }}
      - run: npm test
